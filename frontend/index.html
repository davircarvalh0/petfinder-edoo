<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetFinder - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-container">
        
        <!-- Formulário de Login (Visível por padrão) -->
        <form id="form-login">
            <h2 style="text-align: center; color: #0d6efd;">PetFinder</h2>
            <p style="text-align: center; margin-bottom: 20px;">Login:</p>
            
            <div class="input-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" required>
            </div>
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required>
            </div>
            
            <button type="submit" class="btn-submit">Entrar</button>
            <p style="text-align: center; margin-top: 15px;">
                Não tem uma conta? <a href="#" id="link-cadastro">Cadastre-se</a>
            </p>
        </form>

        <!-- Formulário de Cadastro (Oculto por padrão) -->
        <form id="form-cadastro" style="display: none;">
            <h2 style="text-align: center; color: #0d6efd;">PetFinder</h2>
            <p style="text-align: center; margin-bottom: 20px;">Criar Conta:</p>
            
            <div class="input-group">
                <label for="novo-usuario">Novo Usuário</label>
                <!-- ID corrigido para bater com o JS -->
                <input type="text" id="novo-usuario" required>
            </div>
            <div class="input-group">
                <label for="nova-senha">Nova Senha</label>
                <!-- ID corrigido para bater com o JS -->
                <input type="password" id="nova-senha" required>
            </div>
            <!-- Classes alteradas de "campo" para "input-group" -->
            <div class="input-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
            </div>
            <div class="input-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" required>
            </div>
            <div class="input-group">
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" placeholder="(81) 90000-0000" required>
            </div>
            <div class="input-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            
            <button type="submit" class="btn-submit" style="background-color: #28a745;">Cadastrar</button>
            <p style="text-align: center; margin-top: 15px;">
                Já tem conta? <a href="#" id="link-login">Faça Login</a>
            </p>
        </form>

    </div>

    <!-- O script que controla o login e cadastro -->
    <script src="script.js"></script>
</body>
</html>
