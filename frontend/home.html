<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetFinder - Feed</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* abas de navegacao */
        .abas {
            display: flex;
            gap: 10px;
            background: white;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .aba-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            background: #e9ecef;
            color: #495057;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .aba-btn.ativa { background: #0d6efd; color: white; }
        .aba-btn:hover:not(.ativa) { background: #dee2e6; }

        /* secoes que mostram/escondem */
        .secao { display: none; }
        .secao.ativa { display: block; }

        /* modal de edicao */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.aberto { display: flex; }
        .modal-box {
            background: white;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .modal-box h3 { margin-bottom: 20px; color: #0d6efd; }
        .modal-box .input-group { margin-bottom: 14px; }
        .modal-box .input-group label { display: block; font-weight: 600; margin-bottom: 5px; color: #555; }
        .modal-box .input-group input,
        .modal-box .input-group textarea,
        .modal-box .input-group select {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 6px; font-size: 0.95rem;
        }
        .modal-acoes { display: flex; gap: 10px; margin-top: 20px; }
        .modal-acoes button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-salvar { background: #0d6efd; color: white; }
        .btn-cancelar { background: #6c757d; color: white; }

        /* card das minhas ocorrencias */
        .minha-ocorrencia-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 15px;
        }
        .minha-ocorrencia-card h4 { margin: 0 0 8px; color: #0d6efd; font-size: 1.1rem; }
        .minha-ocorrencia-acoes { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        .minha-ocorrencia-acoes button {
            padding: 9px 16px; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; font-size: 0.9rem;
        }
        /* card do perfil */
        .perfil-card {
            background: white; border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            padding: 25px; margin-bottom: 15px;
        }
        .perfil-card p { margin: 8px 0; font-size: 0.97rem; color: #333; }
        .perfil-card strong { color: #0d6efd; }
    </style>
</head>
<body class="home-page">
    <header class="navbar">
        <h1>PetFinder Feed</h1>
        <div class="user-menu">
            <span id="saudacaoUsuario">Olá, Visitante</span>
            <a href="/" class="logout-btn" id="btnSair">Sair</a>
        </div>
    </header>

    <main class="feed-container">

        <!-- ABAS DE NAVEGACAO -->
        <div class="abas">
            <button class="aba-btn ativa" onclick="mudarAba('feed')">Feed</button>
            <button class="aba-btn" onclick="mudarAba('publicar')">Publicar</button>
            <button class="aba-btn" onclick="mudarAba('minhas')">Minhas Ocorrências</button>
            <button class="aba-btn" onclick="mudarAba('perfil')">Meu Perfil</button>
        </div>

        <!-- ABA: FEED -->
        <div id="secao-feed" class="secao ativa">
            <div style="background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; gap: 10px;">
                <input type="text" id="filtro-busca" placeholder="🔍 Buscar por nome do pet ou do dono..."
                    style="flex:1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none;">
                <button onclick="filtrarAnimais()" style="padding: 10px 20px; background: #0d6efd; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Buscar</button>
                <button onclick="limparFiltro()" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Limpar</button>
            </div>
            <div id="lista-animais" style="display: flex; flex-direction: column; gap: 15px;"></div>
        </div>

        <!-- ABA: PUBLICAR -->
        <div id="secao-publicar" class="secao">
            <div class="create-post">
                <h2>Registrar Pet Perdido</h2>
                <form id="form-ocorrencia">
                    <div style="display: flex; gap: 15px;">
                        <div class="input-group" style="flex:1;">
                            <label>Nome do Animal:</label>
                            <input type="text" id="nome" placeholder="Ex: Rex">
                        </div>
                        <div class="input-group" style="flex:1;">
                            <label>Tipo:</label>
                            <select id="tipo" style="width:100%; padding:10px; border-radius:5px; border:1px solid #ccc;">
                                <option value="cachorro">Cachorro</option>
                                <option value="gato">Gato</option>
                            </select>
                        </div>
                    </div>
                    <div style="display: flex; gap: 15px;">
                        <div class="input-group" style="flex:1;"><label>Raça:</label><input type="text" id="raca" placeholder="Poodle"></div>
                        <div class="input-group" style="flex:1;"><label>Cor:</label><input type="text" id="cor" placeholder="Preto e Branco"></div>
                    </div>
                    <div style="display: flex; gap: 15px;">
                        <div class="input-group" style="flex:1;"><label>Porte:</label><input type="text" id="porte" placeholder="Pequeno, Médio, Grande"></div>
                        <div class="input-group" style="flex:1;"><label>Pelagem:</label><input type="text" id="pelagem" placeholder="Curta, Longa..."></div>
                    </div>
                    <div style="display: flex; gap: 15px;">
                        <div class="input-group" style="flex:1;"><label>Peso (kg):</label><input type="number" id="peso" step="0.1" placeholder="5.5"></div>
                        <div class="input-group" style="flex:1;"><label>Idade (anos):</label><input type="number" id="idade" placeholder="3"></div>
                    </div>
                    <div style="display: flex; gap: 15px;">
                        <div class="checkbox-group"><input type="checkbox" id="usa_coleira"><label for="usa_coleira">Usa coleira?</label></div>
                        <div class="checkbox-group"><input type="checkbox" id="eh_castrado"><label for="eh_castrado">É castrado?</label></div>
                    </div>
                    <div class="input-group">
                        <label>Foto do pet:</label>
                        <input type="file" id="fotoAnimal" accept="image/png, image/jpeg, image/webp">
                        <img id="previewFoto" style="display:none; max-width:100%; max-height:250px; margin-top:10px; border-radius:8px; object-fit:cover;" alt="Preview">
                    </div>
                    <div class="input-group"><label>Local onde foi perdido:</label><input type="text" id="localizacao" placeholder="Ex: Estância" required></div>
                    <div class="input-group"><label>Descrição Adicional:</label><textarea id="descricao" placeholder="Detalhes..."></textarea></div>
                    <button type="submit" class="btn-submit">Publicar Ocorrência</button>
                </form>
            </div>
        </div>

        <!-- ABA: MINHAS OCORRENCIAS -->
        <div id="secao-minhas" class="secao">
            <div id="lista-minhas-ocorrencias" style="display: flex; flex-direction: column; gap: 15px;">
                <p style="text-align:center; color:#888; padding:30px 0;">Carregando suas ocorrências...</p>
            </div>
        </div>

        <!-- ABA: MEU PERFIL -->
        <div id="secao-perfil" class="secao">
            <div class="perfil-card">
                <h3 style="color:#0d6efd; margin-bottom:15px;">👤 Meus Dados</h3>
                <p><strong>Nome:</strong> <span id="perfil-nome">—</span></p>
                <p><strong>E-mail:</strong> <span id="perfil-email">—</span></p>
                <p><strong>Telefone:</strong> <span id="perfil-telefone">—</span></p>
                <p><strong>CPF:</strong> <span id="perfil-cpf">—</span></p>
                <div style="margin-top:20px;">
                    <button onclick="abrirModalPerfil()" style="padding:10px 20px; background:#0d6efd; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
                        Editar Perfil
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL: EDITAR OCORRENCIA -->
    <div class="modal-overlay" id="modal-editar-ocorrencia">
        <div class="modal-box">
            <h3>Editar Ocorrência</h3>
            <input type="hidden" id="edit-animal-id">
            <div class="input-group"><label>Nome do Animal:</label><input type="text" id="edit-nome"></div>
            <div class="input-group"><label>Raça:</label><input type="text" id="edit-raca"></div>
            <div class="input-group"><label>Cor:</label><input type="text" id="edit-cor"></div>
            <div class="input-group"><label>Porte:</label><input type="text" id="edit-porte"></div>
            <div class="input-group"><label>Pelagem:</label><input type="text" id="edit-pelagem"></div>
            <div class="input-group"><label>Peso (kg):</label><input type="number" id="edit-peso" step="0.1"></div>
            <div class="input-group"><label>Idade (anos):</label><input type="number" id="edit-idade"></div>
            <div class="input-group"><label>Local onde foi perdido:</label><input type="text" id="edit-localizacao"></div>
            <div class="input-group"><label>Descrição:</label><textarea id="edit-descricao"></textarea></div>
            <div class="modal-acoes">
                <button class="btn-salvar" onclick="salvarEdicaoOcorrencia()">Salvar</button>
                <button class="btn-cancelar" onclick="fecharModal('modal-editar-ocorrencia')">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: EDITAR PERFIL -->
    <div class="modal-overlay" id="modal-editar-perfil">
        <div class="modal-box">
            <h3>Editar Perfil</h3>
            <p style="color:#888; margin-bottom:15px; font-size:0.9rem;">Preencha apenas os campos que deseja alterar.</p>
            <div class="input-group"><label>Novo E-mail:</label><input type="email" id="edit-perfil-email" placeholder="novo@email.com"></div>
            <div class="input-group"><label>Novo Telefone:</label><input type="text" id="edit-perfil-telefone" placeholder="(81) 90000-0000"></div>
            <div class="input-group"><label>Nova Senha:</label><input type="password" id="edit-perfil-senha" placeholder="deixe em branco para não alterar"></div>
            <div class="input-group"><label>Confirmar Nova Senha:</label><input type="password" id="edit-perfil-senha-confirmar" placeholder="repita a nova senha"></div>
            <div class="modal-acoes">
                <button class="btn-salvar" onclick="salvarEdicaoPerfil()">Salvar</button>
                <button class="btn-cancelar" onclick="fecharModal('modal-editar-perfil')">Cancelar</button>
            </div>
        </div>
    </div>

    <script type="module" src="home.js"></script>
</body>
</html>
